# Nixpacks configuration for Railway frontend deployment

[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
# Only run build, don't run npm ci again (already done in install phase)
cmds = ["npm run build"]
# Disable cache to prevent EBUSY errors
cacheDirectories = []

[start]
cmd = "npx serve -s dist -l $PORT"
